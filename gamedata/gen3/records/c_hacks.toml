# plorpOS's Linux port: the hacks' records as the 3DS / Linux target reads them (`c_only`: only those fields, no
# Kotlin output - the app keeps each one's full Kotlin val, named the same). Values copied from those vals at
# PokeDaisy v1.3.3 (52f9597); the comment on each says where.

# Emerald Legacy v1.1.4 (gen3/hacks/emerald_legacy.toml). Pokedex.kt EMERALD_LEGACY_DEX_FLAGS =
# vanillaDexFlags(0xAF0, 0x3B34): Emerald's flags, its seen copies moved.
[record.EMERALD_LEGACY_DEX_FLAGS]
schema = 'gen3_dexflags'
base = 'EMERALD_DEX_FLAGS'
c_only = true
seenCopies = [0xAF0, 0x3B34]

# Pokedex.kt POKEDEX_EMERALD_LEGACY.
[record.POKEDEX_EMERALD_LEGACY]
schema = 'gen3_pokedex'
base = 'POKEDEX_EMERALD'
c_only = true
entries = 0x0859DD5C
frontPics = 0x0831F560
palettes = 0x08318958
speciesInfo = 0x08348AF4
speciesToNational = 0x08346290
abilityNames = 0x08343CBD
regionalOrder = 0x083465CC
speciesCount = 415
regionalCount = 210
flags = 'EMERALD_LEGACY_DEX_FLAGS'

# GuideRom.kt GUIDE_TABLES_EMERALD_LEGACY (its trainerMon layout, guide id and wild-set vars aren't C fields yet).
[record.GUIDE_TABLES_EMERALD_LEGACY]
schema = 'gen3_guide'
base = 'GUIDE_TABLES_EMERALD'
c_only = true
trainers = 0x083380E8
learnsets = 0x083522A8
wildHeaders = 0x08585028
sb1FlagsOff = 0x13D8
sb1VarsOff = 0x1510
flagBytes = 0x138
